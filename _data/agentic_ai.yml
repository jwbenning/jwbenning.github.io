  - date: 2026-08-31
    title: "Mathematicians are developing rules for AI use — other fields should follow"
    source: Nature news
    url: https://www.nature.com/articles/d41586-026-01881-2
    tags: [policy, debate]
    note: A worked example of another discipline doing exactly what we will attempt in Week 9.

  - date: 2026-08-31
    title: "Ten simple rules for using large language models in science, version 1.0"
    source: Smith et al. 2024, PLOS Computational Biology
    url: https://doi.org/10.1371/journal.pcbi.1011767
