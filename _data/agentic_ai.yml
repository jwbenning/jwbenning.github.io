# Living data for the BIOEE 7600-103 course page (/teaching/agentic-ai/).
# Edit this file to update the page — the layout reads everything from here.
#
#   current_week   which week to highlight in the "This week" panel (0 = before term);
#                  advanced every Monday by .github/workflows/course-week.yml
#   announcement   optional pinned banner at the top; delete the line to hide it
#   announcements  dated log rendered as the Announcements section, newest first.
#                  Slack carries the day-to-day; this is the durable record, so put
#                  anything class-wide here too. `body` is HTML, `title` optional.
#   schedule       the nine themed weeks; `date` may be blank until it is fixed
#                  a week may carry `slides:` with `url:` and an optional `note:`;
#                  the deck itself lives in assets/slides/agentic-ai/
#   links          the reading room; each entry needs a `date:` (when we added it).
#                  Week readings carry a `date:` too and appear in the reading room;
#                  the page sorts everything newest first, so file order does not matter.

