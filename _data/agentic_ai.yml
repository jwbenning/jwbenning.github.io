# Living data for the BIOEE 7600-103 course page (/teaching/agentic-ai/).
# Edit this file to update the page — the layout reads everything from here.
#
#   current_week   which week to highlight in the "This week" panel (0 = before term)
#   announcement   optional banner at the top; delete the line to hide it
#   schedule       the nine themed weeks; `date` may be blank until it is fixed
#   links          the running reading feed, newest first

current_week: 1

announcement: >
  First meeting is <strong>Friday, September 4</strong>, 12:20–1:10 pm in Comstock B104.
  Bring a laptop. Seats are by instructor consent and there are still some left — email
  either of us.

schedule:
  - week: 1
    date: 2026-09-04
    part: Foundations
    theme: What agentic AI is (and isn't) — from LLMs to tool-using agents
    framing: >
      What actually changes when an AI can use tools and take actions instead of only
      producing text — and how is that different from an LLM, from deep learning, and
      from a fixed pipeline?
    demo: >
      A chatbot becomes an agent, live: first watch a model generate plausible text
      rather than verified fact, then give an agent a goal that forces it to reach into
      the world and pull real occurrence records.
    readings:
      - title: "Agentic AI, explained"
        source: MIT Sloan Ideas Made to Matter
        url: https://mitsloan.mit.edu/ideas-made-to-matter/agentic-ai-explained
        tag: intro
      - title: "Building effective agents"
        source: Anthropic
        url: https://www.anthropic.com/engineering/building-effective-agents
        tag: intro
    assignment: >
      Come with one question you would actually want an agent to answer from your own
      research. We will try a few of them live.

  - week: 2
    part: The research data lifecycle
    theme: Agentic coding & data analysis
    framing: >
      The agent wrote the code and found a significant effect. Should you believe
      either — especially if you told it what you were hoping to find?

  - week: 3
    part: The research data lifecycle
    theme: Agentic data exploration, compilation & archiving
    framing: >
      An agent can compile and standardize a messy dataset in seconds. How do you know
      it didn't quietly break it — and can anyone, including future you, reconstruct
      what it did?

  - week: 4
    part: Literature synthesis & writing
    theme: Agentic literature synthesis
    framing: >
      Where does an agent legitimately speed up finding, screening, and synthesizing
      literature — and where does it quietly corrupt the record?

  - week: 5
    part: Literature synthesis & writing
    theme: Agentic scientific writing
    framing: >
      Where does AI-assisted drafting genuinely help — including for researchers
      writing in a second language — and where does it cross into misrepresentation?

  - week: 6
    part: Lab management, teaching & training
    theme: Project & lab management and automation
    framing: >
      Which lab and project tasks should we hand to an agent — and what has to stay
      under direct human control?

  - week: 7
    part: Lab management, teaching & training
    theme: Teaching, mentoring & implications for graduate training
    framing: >
      If a student can generate the answer in seconds, what are we actually teaching —
      and does leaning on agents accelerate skill-building or quietly prevent it?

  - week: 8
    part: Costs, ethics & governance
    theme: Costs, ethics & accountability of agentic AI
    framing: >
      Agents make many model calls, not one — so as ecologists, how should their
      environmental and ethical footprint shape our use of them? And when an autonomous
      system errs, who is accountable?

  - week: 9
    part: Costs, ethics & governance
    theme: Formulating an EEB community guideline
    framing: >
      What should our department collectively expect of anyone using agents in
      research, writing, teaching, and lab work?

