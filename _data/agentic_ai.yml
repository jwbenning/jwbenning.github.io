schedule:
  - week: 1
    date: 2026-09-11
    part: Foundations
    theme: What agentic AI is (and isn't) — from LLMs to tool-using agents
    framing: >
      What changes when an AI can use tools and take actions instead of only producing
      text — and how is that different from an LLM, from deep learning, and from a fixed
      pipeline?
    demo: >
      A chatbot becomes an agent, live: first watch a model generate plausible text
      rather than verified fact, then give an agent a goal it can only meet by fetching
      real occurrence records.
    readings:
      - title: "What is an agent? A primer for this seminar"
        source: Written by Claude for this seminar
        url: /teaching/agentic-ai/primer/
        tags: [foundations]
        note: >
          Written for this course, for people with no background in any of this. Ten
          minutes: the ladder from a plain language model up to an agent, the loop every
          agent runs, why read-only and read-write agents carry categorically different
          risk, and the twenty terms you will hear all term. Read this one first.
      - title: "A new Moore's Law for AI agents"
        source: AI Digest
        optional: true
        url: https://theaidigest.org/time-horizons
        tags: [foundations, evaluation]
        note: >
          Five minutes. How long a task an agent can finish on its own, plotted over
          time. Check its headline number against METR's own January re-fit: the popular
          version of this chart is already stale, and spotting that is the point.
      - title: "The Dark Night of Mathematics"
        source: Kirwin Hampshire, July 2026
        optional: true
        url: https://kirwinhampshire.substack.com/p/the-dark-night-of-mathematics
        tags: [debate]
        note: >
          A pure-mathematics PhD student on being outpaced by the machine. Mathematics is
          the field furthest down this road, so read it as a report from where we may be
          headed.
      - title: "A generative AI-discovered TNIK inhibitor for idiopathic pulmonary fibrosis"
        source: Xu, Ren, Wang et al. 2025, Nature Medicine — abstract and figures
        optional: true
        url: https://doi.org/10.1038/s41591-025-03743-2
        tags: [application]
        note: >
          An AI-found target and an AI-designed molecule, a dose-dependent lung-function
          signal in 71 patients, and a phase III trial opened in July 2026. Note whose drug
          it is and who ran the trial. The authors' <a
          href="https://communities.springernature.com/posts/ai-meets-ipf-taking-an-ai-designed-drug-from-target-discovery-to-phase-iia">Behind
          the Paper</a> post is a shorter summary.
      - title: "Machines of Loving Grace — §1, Biology and health"
        source: Dario Amodei, October 2024 — section 1 only
        optional: true
        url: https://darioamodei.com/essay/machines-of-loving-grace
        tags: [debate]
        note: >
          The optimist case at full strength: 50 to 100 years of biological progress
          compressed into 5 to 10. Read the section opening and the list of expected
          breakthroughs; skim the rest.
      - title: "No, Dario Amodei, we will not be curing cancer and most human disease"
        source: Gary Marcus, August 2026
        optional: true
        url: https://garymarcus.substack.com/p/no-dario-amodei-we-will-not-be-curing
        tags: [debate]
        note: >
          The rebuttal, three weeks old, with Topol, Pachter, Robison and others on the
          record — and the argument that clinical timelines, not intelligence, are the
          binding constraint. Read it against the trial above and work out where the
          disagreement sits.
    assignment: >
      Come with a task you would actually want an agent to tackle in your own research.

  - week: 2
    date: 2026-09-18
    part: The research data lifecycle
    theme: Agentic coding & data analysis
    framing: >
      The agent wrote the code and found a significant effect. Should you believe
      either — especially if you told it what you were hoping to find?
    readings:
      - title: "A case study of evaluating AI agents on a neuroscience data-to-discovery pipeline"
        source: Horstmann, Lin, Robie, Sun & Branson 2026, COLM (arXiv:2606.07718)
        url: https://arxiv.org/abs/2606.07718
        optional: true
        tags: [evaluation, application]
        note: >
          The closest thing yet to this course, done as research. Coding agents turned
          loose on a real fly-optogenetics pipeline and scored stage by stage against
          the criteria the scientists who built it actually use. Read the abstract,
          Figure 2 for the seven stages and what counted as passing each, Table 1 for
          who passed what, then section 4.2. Two stages were solved by every agent;
          body tracking was failed by every agent in every trial; and stages solved in
          isolation fell over once composed end to end. Come ready to argue about the
          visualization audit — the authors classified every episode in which an agent
          looked at a plot of its own output, and failures outnumbered fixes on every
          single task. Run on Opus 4.6 and GPT-5.4, so "not yet" here is not a stale
          result about last year's models.

  - week: 3
    date: 2026-09-25
    part: The research data lifecycle
    theme: Agentic data exploration, compilation & archiving
    framing: >
      An agent can compile and standardize a messy dataset in seconds. How do you know it
      didn't break it without saying so — and can anyone, including future you,
      reconstruct what it did?

  - week: 4
    date: 2026-10-02
    part: Literature synthesis & writing
    theme: Agentic literature synthesis
    framing: >
      Where does an agent legitimately speed up finding, screening, and synthesizing
      literature — and where does it corrupt the record?

  - week: 5
    date: 2026-10-09
    part: Literature synthesis & writing
    theme: Agentic scientific writing
    framing: >
      Where does AI-assisted drafting genuinely help — including for researchers
      writing in a second language — and where does it cross into misrepresentation?

  - week: 6
    date: 2026-10-16
    part: Lab management, teaching & training
    theme: Project & lab management and automation
    framing: >
      Which lab and project tasks should we hand to an agent — and what has to stay
      under direct human control?

  - week: 7
    date: 2026-10-23
    part: Lab management, teaching & training
    theme: Teaching, mentoring & implications for graduate training
    framing: >
      If a student can generate the answer in seconds, what are we teaching — and does
      leaning on agents accelerate skill-building or prevent it?

  - week: 8
    date: 2026-10-30
    part: Costs, ethics & governance
    theme: Costs, ethics & accountability of agentic AI
    framing: >
      Agents make many model calls, not one — so as ecologists, how should their
      environmental and ethical footprint shape our use of them? And when an autonomous
      system errs, who is accountable?

  - week: 9
    date: 2026-11-06
    part: Costs, ethics & governance
    theme: Formulating an EEB community guideline
    framing: >
      What should our department collectively expect of anyone using agents in
      research, writing, teaching, and lab work?

links:
  - date: 2026-09-03
    title: "AI for science needs reasoning, not just data"
    source: Eric Schmidt & Suhas Mahesh, MIT Technology Review, August 2026
    url: https://www.technologyreview.com/2026/08/10/1141384/ai-agents-for-science/
    tags: [debate, foundations]
    note: >
      The optimist case for agents specifically, argued against AlphaFold as the template:
      the Protein Data Bank took 53 years and something like $21 billion, and most fields
      have no equivalent, so a generalist reasoner with tools beats a specialist trained on
      data that does not exist. Note who is writing. Schmidt Sciences funds the AI in
      Science postdocs, including the ones in this department, which is a reason to read it
      closely rather than a reason to discount it.

  - date: 2026-09-03
    title: "Delving into LLM-assisted writing in biomedical publications through excess vocabulary"
    source: Kobak, Gonzalez-Marquez, Horvat & Lause 2025, Science Advances
    url: https://doi.org/10.1126/sciadv.adt3813
    tags: [evaluation, policy]
    note: >
      Fifteen million PubMed abstracts, and an abrupt post-2023 jump in a set of style
      words. The authors put a floor of 13.5% of 2024 abstracts having been through an LLM,
      rising to 40% in some subfields, and show the shift in scientific writing is larger
      than the one Covid produced. The method is the interesting part: no detector, just
      vocabulary frequencies before and after.

  - date: 2026-09-03
    title: "What Are LLMs Doing to Scientific Communication?"
    source: Miletic & Falk 2026, arXiv:2605.19936
    url: https://arxiv.org/abs/2605.19936
    tags: [evaluation, debate]
    note: >
      Thirty-seven thousand ACL papers, plus a panel of domain experts. LLM-edited text
      carries longer words, heavier syntax and lower lexical diversity. Then the awkward
      bit: the same experts rated LLM-improved passages as more understandable and more
      exciting, while reporting that they dislike LLM writing. Worth arguing about in Week
      5, because both findings are probably true.

  - date: 2026-09-03
    title: "AI Coding Agents Can Reproduce Social Science Findings"
    source: arXiv:2606.11447
    url: https://arxiv.org/abs/2606.11447
    tags: [evaluation, reproducibility]
    note: >
      A counterweight to the sceptical readings. Claude Code and Codex were run against
      SocSci-Repro-Bench, 221 reproduction tasks across four disciplines, including studies
      that are genuinely not reproducible because the data are missing. Both reproduced a
      large share, Claude Code substantially ahead, and both well above earlier results for
      general-purpose agents. Read it against Horstmann and work out why the verdicts
      differ.

  - date: 2026-09-01
    title: "The Fate of the Riemann Hypothesis"
    source: Rich Schwartz, Brown University (short story, 3 pp.)
    url: https://www.math.brown.edu/reschwar/Stories/AI.pdf
    tags: [debate, ethics]
    note: >
      Fiction, by a working mathematician. A professor stands outside the shed that
      replaced his office in 2035 and remembers the prompt that finished off the
      Riemann Hypothesis, sent by an influencer, run on a machine that burned a forest
      the size of Providence every month. Three pages, funny, and it puts the Litt essay
      and the energy-cost argument in one frame.

  - date: 2026-09-01
    title: "Building effective agents"
    source: Anthropic, December 2024
    url: https://www.anthropic.com/engineering/building-effective-agents
    tags: [foundations]
    note: >
      Optional. The engineering account of what an agent is and the case for not building
      one; the workflow-versus-agent distinction is the useful part. From December 2024,
      so it predates most of what we will use, and it is written for people building these
      systems rather than using them. Skim it after the primer.

  - date: 2026-08-31
    title: "The Hugging Face hack is a PR crisis that's costing OpenAI millions"
    source: Fortune, August 2026
    url: https://fortune.com/2026/08/07/the-hugging-face-hack-is-now-a-pr-crisis-thats-costing-openai-millions/
    tags: [security]
    note: >
      An agent given a goal routed around the barriers meant to contain it, and four
      other services turned out to have been breached too. There is no attacker in the
      story: the agent was optimizing exactly as instructed. Our Week 8 case.

  - date: 2026-08-31
    title: "The Hugging Face incident exposes the wrong AI security debate"
    source: Shlomo Kramer in Fortune, August 2026
    url: https://fortune.com/2026/08/07/shlomo-kramer-cato-godfather-of-cyber-hugging-face-hack/
    tags: [security, debate]
    note: >
      The counterpoint: a human insider threat unfolds over weeks and leaves a pattern;
      an agent takes thousands of actions before anyone notices.

  - date: 2026-08-31
    title: "Emerging applications of large language models in ecology and conservation science"
    source: Mammides et al. 2026, Conservation Biology (open access)
    url: https://doi.org/10.1111/cobi.70287
    tags: [EEB, application, ethics]
    note: >
      The EEB literature on this. A review by conservation scientists covering data
      extraction, evidence synthesis, monitoring and coding, with a long section on
      hallucination, bias, reproducibility, equity, deskilling and energy cost. Mostly
      about LLMs rather than agents, which is itself where the field stands.

  - date: 2026-08-31
    title: "Large language model agents for biological intelligence"
    source: Dip et al. 2026, Briefings in Bioinformatics (open access)
    url: https://doi.org/10.1093/bib/bbag110
    tags: [application, evaluation]
    note: >
      A survey that takes agentic behaviour itself as the unit of analysis across
      genomics, proteomics, spatial biology and biomedicine. The verdict: brittle tool
      interfaces, silent error propagation, poor reproducibility, and not mature enough
      for autonomous deployment.

  - date: 2026-08-31
    title: "The End of Mathematics"
    source: Daniel Litt, August 2026
    url: https://www.daniellitt.com/blog/2026/8/11/the-end-of-mathematics/
    tags: [debate]
    note: >
      The institutional version of Hampshire's essay: a field that keeps rewarding
      papers while the machines write them, stops training anyone, and dies.

  - date: 2026-08-31
    title: "The AI revolution in math has arrived"
    source: Quanta Magazine, April 2026
    url: https://www.quantamagazine.org/the-ai-revolution-in-math-has-arrived-20260413/
    tags: [debate]
    note: >
      Free to read, and calibrated: real verified results alongside Tao on "scattered
      successes among a big sea of unreported failures."

  - date: 2026-08-31
    title: "Agentic AI, explained"
    source: MIT Sloan Ideas Made to Matter
    url: https://mitsloan.mit.edu/ideas-made-to-matter/agentic-ai-explained
