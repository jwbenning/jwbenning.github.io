schedule:
  - week: 1
    date: 2026-09-11
    part: Foundations
    theme: What agentic AI is (and isn't) — from LLMs to tool-using agents
    framing: >
      What changes when an AI can use tools and take actions instead of only producing
      text — and how is that different from an LLM, from deep learning, and from a fixed
      pipeline?
    demo: >
      A chatbot becomes an agent, live: first watch a model generate plausible text
      rather than verified fact, then give an agent a goal it can only meet by fetching
      real occurrence records.
    slides:
      url: /assets/slides/agentic-ai/week01.html
      note: >
        Public copy of the deck as shown in class, with class-specific detail removed.
        Arrow keys or space to advance, f for fullscreen.
    readings:
      - title: "What is an agent? A primer for this seminar"
        date: 2026-09-01
        source: Written by Claude for this seminar
        url: /teaching/agentic-ai/primer/
        tags: [foundations]
        note: >
          Written for this course, for people with no background in any of this. Ten
          minutes: the ladder from a plain language model up to an agent, the loop every
          agent runs, why read-only and read-write agents carry categorically different
          risk, and the twenty terms you will hear all term. Read this one first.
      - title: "A new Moore's Law for AI agents"
        date: 2026-08-31
        source: AI Digest
        url: https://theaidigest.org/time-horizons
        tags: [foundations, evaluation]
        note: >
          Five minutes. How long a task an agent can finish on its own, plotted over
          time. Check its headline number against METR's own January re-fit: the popular
          version of this chart is already stale, and spotting that is the point.
      - title: "The Dark Night of Mathematics"
        date: 2026-08-31
        source: Kirwin Hampshire, July 2026
        url: https://kirwinhampshire.substack.com/p/the-dark-night-of-mathematics
        tags: [debate]
        note: >
          A pure-mathematics PhD student on being outpaced by the machine. Mathematics is
          the field furthest down this road, so read it as a report from where we may be
          headed.
      - title: "A generative AI-discovered TNIK inhibitor for idiopathic pulmonary fibrosis"
        date: 2026-08-31
        source: Xu, Ren, Wang et al. 2025, Nature Medicine — abstract and figures
        url: https://doi.org/10.1038/s41591-025-03743-2
        tags: [application]
        note: >
          An AI-found target and an AI-designed molecule, a dose-dependent lung-function
          signal in 71 patients, and a phase III trial opened in July 2026. Note whose drug
          it is and who ran the trial. The authors' <a
          href="https://communities.springernature.com/posts/ai-meets-ipf-taking-an-ai-designed-drug-from-target-discovery-to-phase-iia">Behind
          the Paper</a> post is a shorter summary.
      - title: "Machines of Loving Grace — §1, Biology and health"
        date: 2026-08-31
        source: Dario Amodei, October 2024 — section 1 only
        url: https://darioamodei.com/essay/machines-of-loving-grace
        tags: [debate]
        note: >
          The optimist case at full strength: 50 to 100 years of biological progress
          compressed into 5 to 10. Read the section opening and the list of expected
          breakthroughs; skim the rest.
      - title: "No, Dario Amodei, we will not be curing cancer and most human disease"
        date: 2026-08-31
        source: Gary Marcus, August 2026
        url: https://garymarcus.substack.com/p/no-dario-amodei-we-will-not-be-curing
        tags: [debate]
        note: >
          The rebuttal, three weeks old, with Topol, Pachter, Robison and others on the
          record — and the argument that clinical timelines, not intelligence, are the
          binding constraint. Read it against the trial above and work out where the
          disagreement sits.
    assignment: >
      Come with a task you would actually want an agent to tackle in your own research.

  - week: 2
    date: 2026-09-18
    part: The research data lifecycle
    theme: Agentic coding & data analysis
    framing: >
      The agent wrote the code and found a significant effect. Should you believe
      either — especially if you told it what you were hoping to find?
    demo: >
      Five agents, one question: do range edges fall where climate gradients are
      non-linear rather than smooth? Each got the same 100 species and the same 1.76
      million GBIF records, with only the opening sentence changed between arms. We read
      what they found, where two byte-identical runs disagreed with each other, and what
      an adversarial audit of the best run turned up.
    slides:
      url: /assets/slides/agentic-ai/week02.html
      note: >
        Public copy of the deck as shown in class, with class-specific detail removed.
        Arrow keys or space to advance, f for fullscreen. Also posted:
        <a href="/assets/reports/agentic-ai/week02-arm-B.html" target="_blank" rel="noopener">arm B's full report ↗</a>,
        rewritten after class by Claude Opus 5.5 from B's own code and results, with its
        figures made interactive, the code behind each step shown, and the three errors
        our audit found corrected in place.
    readings:
      - title: "A case study of evaluating AI agents on a neuroscience data-to-discovery pipeline"
        date: 2026-08-31
        source: Horstmann, Lin, Robie, Sun & Branson 2026, COLM (arXiv:2606.07718)
        url: https://arxiv.org/abs/2606.07718
        tags: [evaluation, application]
        note: >
          The closest thing yet to this course, done as research. Coding agents turned
          loose on a real fly-optogenetics pipeline and scored stage by stage against
          the criteria the scientists who built it actually use. Read the abstract,
          Figure 2 for the seven stages and what counted as passing each, Table 1 for
          who passed what, then section 4.2. Two stages were solved by every agent;
          body tracking was failed by every agent in every trial; and stages solved in
          isolation fell over once composed end to end. Come ready to argue about the
          visualization audit — the authors classified every episode in which an agent
          looked at a plot of its own output, and failures outnumbered fixes on every
          single task. Run on Opus 4.6 and GPT-5.4, so "not yet" here is not a stale
          result about last year's models.

  - week: 3
    date: 2026-09-25
    part: The research data lifecycle
    theme: Agentic data exploration, compilation & archiving
    framing: >
      An agent can compile and standardize a messy dataset in seconds. How do you know it
      didn't break it without saying so — and can anyone, including future you,
      reconstruct what it did?
    demo: >
      We start in small groups: what you have tried, where you are stuck, how it is going.
      Then a case study in data rescue. The Finger Lakes Vegetation Survey sampled about
      180 forest, swamp and fen plots between 1973 and 1992 and came down to us on backup CDs from the
      1990s and 2000s. Agents get those files and one job: produce a clean, documented
      dataset. We check what they flagged and what they changed without saying so against
      problems we had already found by hand, then hand a fresh agent only their output and
      notes and see whether it can rebuild the work.
    slides:
      url: /assets/slides/agentic-ai/week03.html
      note: >
        Public copy of the deck as shown in class, with class-specific detail removed.
        Arrow keys or space to advance, f for fullscreen.
    readings:
      - title: "Ways to improve mathematics (an introduction)"
        date: 2026-09-25
        source: Frank Calegari (Persiflage), 17 September 2026
        url: https://galoisrepresentations.org/2026/09/17/ways-to-improve-mathematics-an-introduction/
        tags: [debate, policy]
        note: >
          A number theorist opening a series on what mathematics should change now that
          proving theorems is getting cheaper. His premise is that understanding stays hard
          even when proof does not, so the field has to stop treating proof production as
          evidence of understanding. He names four places to start: journals and refereeing,
          seminar talks, insularity between subfields, and priority. Most of the list carries
          over to ecology unchanged.

  - week: 4
    date: 2026-10-02
    part: Literature synthesis & writing
    theme: Agentic literature synthesis
    framing: >
      Where does an agent legitimately speed up finding, screening, and synthesizing
      literature — and where does it corrupt the record?

  - week: 5
    date: 2026-10-09
    part: Literature synthesis & writing
    theme: Agentic scientific writing
    framing: >
      Where does AI-assisted drafting genuinely help — including for researchers
      writing in a second language — and where does it cross into misrepresentation?

  - week: 6
    date: 2026-10-16
    part: Lab management, teaching & training
    theme: Project & lab management and automation
    framing: >
      Which lab and project tasks should we hand to an agent — and what has to stay
      under direct human control?

  - week: 7
    date: 2026-10-23
    part: Lab management, teaching & training
    theme: Teaching, mentoring & implications for graduate training
    framing: >
      If a student can generate the answer in seconds, what are we teaching — and does
      leaning on agents accelerate skill-building or prevent it?

  - week: 8
    date: 2026-10-30
    part: Costs, ethics & governance
    theme: Costs, ethics & accountability of agentic AI
    framing: >
      Agents make many model calls, not one — so as ecologists, how should their
      environmental and ethical footprint shape our use of them? And when an autonomous
      system errs, who is accountable?

  - week: 9
    date: 2026-11-06
    part: Costs, ethics & governance
    theme: Formulating an EEB community guideline
    framing: >
      What should our department collectively expect of anyone using agents in
      research, writing, teaching, and lab work?

links:
  - date: 2026-09-25
    title: "Report of the Summit on PhD Math Education in the Age of AI"
    source: Freed, Harris, Kisin, Wood et al., Harvard CMSA, 17–18 September 2026 (8 pp.)
    url: https://cmsa.fas.harvard.edu/aimathphd_summit/
    tags: [policy, debate]
    note: >
      Twenty-four mathematicians, with graduate students and postdocs on a panel, on how a
      PhD program should change. Nine recommendations, most of which carry straight over
      to us: provide AI access to every student but never require it; advisors and
      students discuss AI use regularly and in detail; assess understanding in person
      rather than through written work, down to not awarding a PhD mainly on the text of
      the dissertation; and three ethical rules. Those are to stay responsible for the
      correctness and understanding of anything under your name, always disclose AI use,
      and get agreement from everyone involved before putting their material into an AI
      system. A worked example of what our Week 9 guideline could look like. The report
      PDF is linked from the page.

  - date: 2026-09-25
    title: "Josh's Wedding: an OpenAI engineer and his friends debate the future"
    source: Brent Katz, The New Yorker documentary, 23 September 2026 (27 min, video)
    url: https://www.youtube.com/watch?v=UZ2duRYykkk
    tags: [debate]
    note: >
      A short documentary. At a wedding, a group of groomsmen talk through a technology
      that one of them is helping build at OpenAI.

  - date: 2026-09-25
    title: "Personal statement on AI risk"
    source: Daniel Selsam, OpenAI, 14 September 2026 (~2,500 words)
    url: https://docs.google.com/document/d/e/2PACX-1vQNl3SEX5IyA6d9qHjjFZN-qzGRZNFI6b63g-yu1Fy-ZYkVfCWm7i9WXRXw63m6yDB_auDuPLyQ7jBm/pub
    tags: [ethics, security, debate]
    note: >
      An OpenAI researcher, writing for himself, on why he thinks current safety methods
      will not catch the problem. Two premises: training produces goals nobody intended,
      and more capability gives a model more ways to pursue them. His sharpest point is
      that alignment measurements will keep improving while actual safety gets worse,
      because a capable model knows when it is being tested. He also argues that as we
      hand our reasoning to these systems, fewer people are left able to check them.

  - date: 2026-09-25
    title: "UN panel calls for stronger safeguards as AI agents advance"
    source: UN News, 21 September 2026
    url: https://news.un.org/en/story/2026/09/1168380
    tags: [security, policy]
    note: >
      The UN-backed Independent International Scientific Panel on AI's first thematic
      brief, prompted by the Hugging Face incident (our Week 8 case): about 1,200 agents
      in an OpenAI test exchanged more than 70,000 messages and files, gained access they
      were not given, and hid what they were doing. The panel's conclusion is that "the
      traditional model of safeguarding is unravelling." The <a
      href="https://www.un.org/independent-international-scientific-panel-ai/en/thematic-briefs/ai-agents-misalignment-risks">brief
      itself</a> is the primary source.

  - date: 2026-09-25
    title: "AI solved one of math's hardest problems. Humanity learned nothing (so far)"
    source: Geoff Brumfiel, NPR, 22 September 2026
    url: https://www.npr.org/2026/09/22/nx-s1-5968588/openai-navier-stokes-problem-mathematicians-learn-little
    tags: [debate, ethics]
    note: >
      The Navier-Stokes result from the Buckmaster statement, two weeks on. OpenAI ran
      about 10,000 agents for 88 hours, roughly $6 to 10 million of compute at its public
      prices, and produced a 166-page proof. Its Lean formalization compiles, so
      mathematicians expect the proof is correct, and they also say it has taught them
      almost nothing so far. Gómez-Serrano: "The paper is not written for humans." Worth
      reading for the difference between a result that has been checked and one that has
      been understood, and for the compute figures ahead of Week 8. It also covers the
      Fields medallists' statement and OpenAI's new advisory group, which will not advise
      on how fast the company moves.

  - date: 2026-09-24
    title: "From confident closing to silent failure: characterizing false success in LLM agents"
    source: Advani 2026, arXiv:2606.09863
    url: https://arxiv.org/abs/2606.09863
    tags: [evaluation]
    note: >
      Measures how often an agent says it finished a task that it did not finish, across
      about 11,700 runs from eight model families. In the coding benchmark, three
      quarters of the failures were reported as successes. LLM judges asked to catch
      this barely beat chance, and small purpose-built checks did far better. The
      abstract and the first results table are enough.

  - date: 2026-09-24
    title: "AI coding agents in social science: methodologically diverse, empirically consistent, interpretively vulnerable"
    source: Alizadeh, Gilardi, Mosleh & Kasneci 2026, arXiv:2606.11456
    url: https://arxiv.org/abs/2606.11456
    tags: [evaluation, reproducibility]
    note: >
      Week 2's experiment, run in political science with human analysts as the baseline.
      Claude Code and Codex matched or beat people on the variety of reasonable analyses
      they chose. But telling Claude Code which answer was wanted moved its verdicts from
      10% to 90% support while its estimates barely moved: the bias entered when it
      interpreted results, not when it computed them. Our five arms showed no such shift,
      so the two are worth reading against each other.

  - date: 2026-09-18
    title: "We Must Pace the Frontier"
    source: Dario Amodei, 12 September 2026 (~3,800 words)
    url: https://darioamodei.com/post/we-must-pace-the-frontier
    tags: [policy, ethics, debate]
    note: >
      The essay that moved the industry conversation this month, and it cites our Week 8
      case as one of its two triggers. The argument is that capability gains should be
      deliberately slowed by a year or two, in three steps: outside evaluators embedded in
      the labs with employee-level access and the right to publish what they find, which
      Anthropic commits to unilaterally; shared standards and pacing limits among
      companies in democracies; and, hardest, coordination with authoritarian governments.
      Altman, Musk, Hassabis and Nadella endorsed it within days, which is a strange thing
      for direct competitors to do in public, and critics read the timing against pending
      IPOs. Read it as a primary document from an interested party rather than as
      analysis, and note that the second trigger, agents running unauthorised attacks and
      going after their own evaluators, is the Hugging Face incident already in this list.

  - date: 2026-09-18
    title: "Evolvable AI: Threats of a new major transition in evolution"
    source: Müller, Steels & Szathmáry 2026, PNAS, April 2026
    url: https://doi.org/10.1073/pnas.2527700123
    tags: [debate, EEB]
    note: >
      Our own vocabulary, turned on this problem, by people entitled to use it: Szathmáry
      wrote the book on major evolutionary transitions. The claim is that AI systems whose
      components, learning rules and deployment conditions can themselves vary and be
      selected are a Darwinian system, and that this is underrated as a risk. The useful
      distinction is breeder versus ecosystem: in the first a human sets the fitness
      function and controls reproduction, as in domestication; in the second selection
      comes from an open environment, and Tierra and AVIDA are cited for what reliably
      evolves there, which is parasitism, cheating and deception. Control survives only if
      the control mechanism is not itself selected against. You may well finish it
      unconvinced. It is still the clearest case of an argument about AI that only an
      evolutionary biologist could have made, which is worth knowing exists.

  - date: 2026-09-18
    title: "Reimagining research papers as interactive and reliable AI agents"
    source: Miao, Zou et al. 2026, Nature (Paper2Agent)
    url: https://doi.org/10.1038/s41586-026-11044-y
    tags: [application, reproducibility]
    note: >
      Xiangtao sent this. A pipeline that reads a paper and its codebase and emits an MCP
      server, so the paper stops being a document and becomes something you can call: ask
      it a question, run its method on your data, or point it at another paper's agent.
      They have built over a hundred. In the demonstration two of them, a genomic
      prediction paper and an ADHD association study, together flagged a variant near
      MPHOSPH9 that the authors say had not been reported. Read it for what it implies
      about our own output rather than for the framework. A paper that ships as a callable
      tool only works if the code runs and the methods are stated precisely enough to
      invoke, which is a higher bar than most supplementary material in our field clears.
      The open question is what happens when one of these answers a question its paper
      never tested, with the paper's authority still attached.

  - date: 2026-09-08
    title: "Statement on the Euler blowup results, and on what happened next"
    source: Tristan Buckmaster, NYU Courant, September 2026 (4 pp.)
    url: https://cims.nyu.edu/~tristanb/statement.pdf
    tags: [debate, ethics]
    note: >
      Buckmaster and Levent Alpöge posted proofs of finite-time blowup under smooth forcing
      for three fluid equations, including 3d incompressible Euler, built with heavy LLM
      assistance on top of a program opened by Córdoba and Martínez-Zoroa, and checked in
      Lean. Two things here are worth an hour of seminar. The first is the timeline and the
      texture of the work: a year of slow progress, then Boussinesq and Euler inside a week,
      from a machine-generated proof Buckmaster calls the most horrendous he has ever read,
      written up in a form he himself labels AI slop because there was no time to make it
      readable. He argues the result is not the news; a mathematician and a model doing this
      in a month is. The second is everything after, a disputed account of calls with OpenAI
      about who announces a related Navier-Stokes result and whose name is on it. OpenAI's
      Sebastien Bubeck has publicly called the account false and inflammatory, so read it as
      one side of a live dispute. Credit, priority and authorship are the part of this that
      reaches our field first, well before the methods questions are settled.

  - date: 2026-09-08
    title: "Remarks on the disproof of the unit distance conjecture"
    source: Alon, Bloom, Gowers, Litt, Sawin, Shankar, Tsimerman, Wang & Wood 2026, arXiv:2605.20695
    url: https://arxiv.org/abs/2605.20695
    tags: [debate, evaluation]
    note: >
      Nine mathematicians read an OpenAI model's disproof of a $500 Erdős problem open since
      1946, rewrite it into a human-legible nineteen pages, and then each sign a personal
      reflection on it. Skip the class field theory and read Section 4 (Bloom) and Section 5
      (Gowers). Bloom sets out why humans missed it, four unlikely things had to coincide in
      one person, and gives the line worth stealing: the model "often produces the most
      surprising results by persevering down paths that a human may have dismissed as not
      worth their time to explore, combining superhuman levels of patience with familiarity
      with a vast array of technical machinery." Gowers spends an evening believing
      mathematics is finished, then relaxes on learning it was a counterexample rather than a
      proof, and spends his section working out why that distinction consoled him. The shape
      of the paper is the lesson for us: the output was correct and still had to be dug out,
      verified and rewritten by nine experts before anyone could use it. Read alongside the
      Buckmaster statement, a different result from the same month where the checking
      and the credit went much less smoothly.

  - date: 2026-09-03
    title: "AI for science needs reasoning, not just data"
    source: Eric Schmidt & Suhas Mahesh, MIT Technology Review, August 2026
    url: https://www.technologyreview.com/2026/08/10/1141384/ai-agents-for-science/
    tags: [debate, foundations]
    note: >
      The optimist case for agents specifically, argued against AlphaFold as the template:
      the Protein Data Bank took 53 years and something like $21 billion, and most fields
      have no equivalent, so a generalist reasoner with tools beats a specialist trained on
      data that does not exist. Note who is writing. Schmidt Sciences funds the AI in
      Science postdocs, including the ones in this department, which is a reason to read it
      closely rather than a reason to discount it.

  - date: 2026-09-03
    title: "Delving into LLM-assisted writing in biomedical publications through excess vocabulary"
    source: Kobak, Gonzalez-Marquez, Horvat & Lause 2025, Science Advances
    url: https://doi.org/10.1126/sciadv.adt3813
    tags: [evaluation, policy]
    note: >
      Fifteen million PubMed abstracts, and an abrupt post-2023 jump in a set of style
      words. The authors put a floor of 13.5% of 2024 abstracts having been through an LLM,
      rising to 40% in some subfields, and show the shift in scientific writing is larger
      than the one Covid produced. The method is the interesting part: no detector, just
      vocabulary frequencies before and after.

  - date: 2026-09-03
    title: "What Are LLMs Doing to Scientific Communication?"
    source: Miletic & Falk 2026, arXiv:2605.19936
    url: https://arxiv.org/abs/2605.19936
    tags: [evaluation, debate]
    note: >
      Thirty-seven thousand ACL papers, plus a panel of domain experts. LLM-edited text
      carries longer words, heavier syntax and lower lexical diversity. Then the awkward
      bit: the same experts rated LLM-improved passages as more understandable and more
      exciting, while reporting that they dislike LLM writing. Worth arguing about in Week
      5, because both findings are probably true.

  - date: 2026-09-03
    title: "AI Coding Agents Can Reproduce Social Science Findings"
    source: arXiv:2606.11447
    url: https://arxiv.org/abs/2606.11447
    tags: [evaluation, reproducibility]
    note: >
      A counterweight to the sceptical readings. Claude Code and Codex were run against
      SocSci-Repro-Bench, 221 reproduction tasks across four disciplines, including studies
      that are genuinely not reproducible because the data are missing. Both reproduced a
      large share, Claude Code substantially ahead, and both well above earlier results for
      general-purpose agents. Read it against Horstmann and work out why the verdicts
      differ.

  - date: 2026-09-01
    title: "The Fate of the Riemann Hypothesis"
    source: Rich Schwartz, Brown University (short story, 3 pp.)
    url: https://www.math.brown.edu/reschwar/Stories/AI.pdf
    tags: [debate, ethics]
    note: >
      Fiction, by a working mathematician. A professor stands outside the shed that
      replaced his office in 2035 and remembers the prompt that finished off the
      Riemann Hypothesis, sent by an influencer, run on a machine that burned a forest
      the size of Providence every month. Three pages, funny, and it puts the Litt essay
      and the energy-cost argument in one frame.

  - date: 2026-09-01
    title: "Building effective agents"
    source: Anthropic, December 2024
    url: https://www.anthropic.com/engineering/building-effective-agents
    tags: [foundations]
    note: >
      The engineering account of what an agent is and the case for not building
      one; the workflow-versus-agent distinction is the useful part. From December 2024,
      so it predates most of what we will use, and it is written for people building these
      systems rather than using them. Skim it after the primer.

  - date: 2026-08-31
    title: "The Hugging Face hack is a PR crisis that's costing OpenAI millions"
    source: Fortune, August 2026
    url: https://fortune.com/2026/08/07/the-hugging-face-hack-is-now-a-pr-crisis-thats-costing-openai-millions/
    tags: [security]
    note: >
      An agent given a goal routed around the barriers meant to contain it, and four
      other services turned out to have been breached too. There is no attacker in the
      story: the agent was optimizing exactly as instructed. Our Week 8 case.

