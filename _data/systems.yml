- key: cx
  name: Range limits and population biology of a California endemic plant
  latin: Clarkia xantiana
  color: "#c2410c"
  thumb: assets/img/gallery/clarkia-xantiana.jpg
  thumb_alt: A pink Clarkia xantiana flower
  blurb: |
    A species' range limit is where adaptation runs out. Before asking why adaptation fails
    there, though, we have to answer something more basic: what is it about the environment
    beyond the edge that keeps populations from establishing? Distribution models almost always
    answer "climate," because climate is what is easy to measure. Most range edges are gradients
    in many things at once, biotic and abiotic together.

    *Clarkia xantiana* is an annual plant of the southern Sierra Nevada whose eastern range
    margin falls across one of these compound gradients. Transplanting it beyond that margin,
    and manipulating candidate factors one at a time, lets us measure what each contributes to
    lifetime fitness. The answer has repeatedly been that the biotic environment matters as much
    as the abiotic one: herbivores, pollinators, and soil microbes each move fitness beyond the
    edge by as much as precipitation does. Two decades of demographic monitoring and a growing
    body of genomic data let us ask the same questions through time as well as across space.
  hook: Why does a plant stop where it does? We take a range edge apart, factor by factor, in the field.
  work:
    - "**Space and time.** Pool-sequencing roughly 100 populations, sampled both historically and today, to ask whether the same loci track climate across the range and across decades."
    - "**Two decades of demography.** Long-term census data from the Moeller and Geber labs, which puts a population trajectory behind every allele frequency."
    - "**Biotic range limits.** Transplants beyond the margin that manipulate herbivores, pollinators and soil microbes one at a time, to measure what each contributes to lifetime fitness."
  funding: []
  figures:
    - path: assets/img/gallery/clarkia-system.jpg
      alt: "Four panels: a kangaroo rat at night, a bee on a Clarkia flower, a gridded field plot, and a seed dish"
      caption: "The system: seed predators, pollinators, transplant plots, seed."
    - path: assets/img/photos/2026-06-20_canyon-slope.jpg
      alt: Dry canyon slope in the Kern River Canyon
      caption: Kern River Canyon, at the eastern range margin.
    - path: assets/img/gallery/flowering-drought-shift.jpg
      alt: Distribution of days to flowering before and after a drought
      caption: Flowering time before and after the drought.
  people: With Dave Moeller (Minnesota), Monica Geber (Cornell), and Vince Eckhart (Grinnell).

- key: gc
  name: Ecological genetics of a rare wildflower
  latin: Gentianopsis crinita
  color: "#1d4ed8"
  thumb: assets/img/gallery/gentian-bumblebee.jpg
  thumb_alt: A bumblebee on the fringed corolla of a fringed gentian flower
  thumb_credit: Ella Mancino
  blurb: |
    The fringed gentian is a charismatic late-summer flower of wet meadows across eastern North
    America, and it is vanishing from sites where it was once reliable. Decline is easy to
    observe and hard to attribute. Small populations lose genetic variation and suffer
    demographic bad luck; habitat gets wetter, drier, or shadier; the climate a population is
    adapted to drifts out from under it. These are not competing hypotheses so much as processes
    that feed each other, and separating them takes demography and genomics on the same
    populations.
  hook: The fringed gentian is disappearing from eastern wet meadows. We want to know which of the obvious explanations is right.
  work:
    - "**Demography.** Long-term monitoring across populations, to establish which are actually declining and how fast."
    - "**Genomics.** A reference genome and whole-genome resequencing, to ask whether declining populations have lost variation or accumulated genetic load."
    - "**Common garden.** Growing populations side by side, to test whether plants are still matched to the climates they came from."
  funding: []
  figures: []
  people: With Anurag Agrawal (Cornell).

- key: expevo
  name: Experimental evolution in the lab
  latin: Tribolium castaneum & Escherichia coli
  color: "#0d9488"
  thumb: assets/img/gallery/tribolium-boxes.jpg
  thumb_alt: A row of clear plastic boxes of flour beetles, with beetle density declining from left to right
  blurb: |
    Theory says that the steepness of an environmental gradient and the amount of dispersal
    together decide whether a population expands, stalls, or forms a stable range limit. Almost
    none of that has been tested directly, because a natural range limit gives you one replicate
    and no control over the gradient. Existing models also leave out things we know are true of
    real environments: that they vary in time as well as in space, and that dispersal itself
    evolves.

    Beetles and bacteria let us do the experiment properly. We build gradients out of connected
    patches, let dozens of replicate populations expand across them, and watch the same process
    play out many times, with the environment under our control and every generation sampled.
    Simulation models run alongside the experiments, both to generate the predictions and to ask
    what the results would have looked like under processes we did not impose.
  hook: Range-limit theory makes sharp predictions that are almost impossible to test in the field. So we build the landscape in the lab.
  work:
    - "**Beetle landscapes.** Replicate *Tribolium* range expansions across gradients of increasing steepness, with whole-genome sequencing of the evolved populations."
    - "**Microbial expansions.** *E. coli* populations spreading across spatially and temporally varying environments, where a whole experiment fits in days rather than years."
    - "**Theory alongside.** Models of how temporal variance and evolving dispersal set where a range stops, which generate the predictions the experiments test."
  funding:
    - "NSF DEB-2230806 (with Topher Weiss-Lehman, Wyoming)"
  figures:
    - path: assets/img/publication_preview/temporal-variance.png
      alt: Conceptual diagram of two modes of temporal environmental variation
      caption: Two ways an environment can vary in time.
    - path: assets/img/publication_preview/dispersal-evolution.png
      alt: Dispersal phenotype of core and edge populations across environmental gradients
      caption: Dispersal evolution along gradients of increasing steepness.
  people: Beetle experimental evolution with Topher Weiss-Lehman (Wyoming).

- key: invasions
  name: Range expansions and invasions
  latin:
  color: "#b45309"
  thumb: assets/img/gallery/ragweed-seedling.jpg
  thumb_alt: A young common ragweed plant with deeply dissected leaves, growing in bare soil
  # John's own photo — no credit line needed.
  hook: When a population spreads fast into somewhere new, does natural selection keep up, or does chance take over?
  blurb: |
    Spread is an evolutionary process as much as an ecological one. A population moving into
    new territory does so through a chain of founder events, each one a small sample of the
    last, which lets deleterious mutations accumulate and lets drift overwhelm selection. At
    the same time the expanding front meets new conditions, which should favour local
    adaptation if there is enough genetic variation to work with. Which of those wins helps
    determine how fast a spread goes and how far it gets.

    Two plants let us watch this at different scales. Common tansy has spread across North
    America over roughly 150 years, a chronosequence written into the landscape. Common
    ragweed has repeatedly evolved herbicide resistance across its agricultural range, so what
    spreads there is not the species but an allele. Alongside both, we model how dispersal
    itself evolves during an expansion, which turns out to change the answer.
  work:
    - "**Expansion load in tansy.** A common garden spanning a 150-year invasion chronosequence, paired with genome-wide SNP data and demographic surveys of 173 populations. Fitness falls with distance from the invasion core, homozygosity rises, and we found no sign of local adaptation."
    - "**Herbicide resistance in ragweed.** Whole-genome sequencing of resistant and susceptible populations, asking whether resistance came from standing variation or new mutation, and reconstructing how the alleles moved across the landscape."
    - "**Dispersal evolution.** Models showing that environmental gradients oppose the evolution of increased dispersal during invasion, and that *reduced* dispersal can make an expansion faster by limiting maladaptive gene flow."
  funding: []
  # No tansy imagery: it is Ryan Briscoe Runquist's and Dave Moeller's project,
  # not John's, so it stays in the text but does not carry the section visually.
  figures: []
  people: Tansy with Ryan Briscoe Runquist and Dave Moeller (Minnesota).

- key: flvs
  hidden: true   # held back 2026-09-08 on John's call; add back later
  name: Fifty years of change in Finger Lakes forests
  latin: Finger Lakes Vegetation Survey
  color: "#6d28d9"
  thumb:
  thumb_alt:
  blurb: |
    Around 1980, Peter Marks surveyed the plant communities of the central Finger Lakes region
    in detail: nearly 200 stands, recorded by a systematist who knew the flora cold. The survey
    became the basis of his regional guide to plant communities, and then effectively
    disappeared. The underlying data has never been used in a journal publication; it survives
    only inside the book's classification and on a set of backup discs recovered in early 2026.

    That makes it unusually valuable. Half a century is close to the ideal interval for detecting
    change driven by climate, land use, deer, and invasion, and comparable baselines for this
    region are rare. We are digitizing the original records, working out where each plot actually
    was, and preparing to resurvey them.
  hook: A careful botanist surveyed these forests around 1980 and never published the data. We are recovering it, and going back.
  funding: []
  figures: []
  people: With Peter L. Marks (Cornell, emeritus).
