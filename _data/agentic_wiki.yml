# Section nav for /agentic/. Adding a page means adding it here and creating
# _pages/agentic_<slug>.md with `wiki_slug: <slug>` in its front matter.
#
# `repo` is the companion starter repo; pages link to it as {{ site.data.agentic_wiki.repo }}.

repo: https://github.com/benning-lab/agentic-starter

groups:
  - title: Start here
    pages:
      - slug: start
        title: Your first hour
        blurb: Install it, point it at a real folder, and watch what it does before it answers.
      - slug: norms
        title: How to work with it
        blurb: The rules that decide whether the output is trustworthy, and what it is bad at.

  - title: Memory
    pages:
      - slug: context
        title: The four files
        blurb: Why a new session knows nothing, and the small set of files that fixes it.
      - slug: hooks
        title: Making it automatic
        blurb: Hooks that carry context from one session to the next with nothing to remember.

  - title: Going further
    pages:
      - slug: terminal
        title: The terminal setup
        blurb: Ghostty, tmux, and a launcher that keeps one live session per project.
      - slug: skills
        title: Teaching it your domain
        blurb: When the model is confidently wrong about your field, and how to ground it.
      - slug: tools
        title: Connecting your real tools
        blurb: Email, calendar, files, Slack, the browser. What it unlocks and what it costs.
      - slug: assistant
        title: A research assistant
        blurb: The daily workflows that become possible once the tools are connected.

  - title: Practical
    pages:
      - slug: reports
        title: Reports you can read
        blurb: Ask for one self-contained HTML file instead of a wall of terminal output.
      - slug: machines
        title: Many machines, one setup
        blurb: What to sync, what to leave alone, and which half must never live in a drive.
